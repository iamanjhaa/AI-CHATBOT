<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAHAYAK</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section class="chat-panel" aria-label="SAHAYAK chatbot" aria-describedby="noticeText">
      <header class="chat-header">
        <div class="brand-block">
          <h1 id="appTitle">SAHAYAK</h1>
          <p class="eyebrow">Real-world problem resolution assistant</p>
        </div>
        <div class="header-controls">
          <label for="languageSelect" id="languageLabel">Language</label>
          <select id="languageSelect">
            <option value="hi">हिंदी</option>
            <option value="en" selected>English</option>
          </select>
          <span id="statusPill" class="status-pill" role="status" aria-live="polite">Ready</span>
        </div>
      </header>

      <div id="noticeText" class="notice">
        Describe a household or local societal problem in Hindi, Hinglish, or English.
      </div>

      <section id="chatMessages" class="chat-messages" aria-live="polite">
        <article class="message ai-message">
          <div class="avatar">AI</div>
          <div class="bubble">
            <p id="welcomeText">Hello! I am SAHAYAK. Tell me your problem and I will suggest safe next steps.</p>
          </div>
        </article>
      </section>

      <div id="errorBox" class="error-box" role="alert"></div>

      <form id="chatForm" class="chat-form">
        <label id="problemLabel" class="sr-only" for="problemInput">Describe your problem</label>
        <textarea
          id="problemInput"
          dir="auto"
          rows="2"
          placeholder="Example: Mere ghar mein gas leak ho rahi hai aur smell aa rahi hai ..."
          aria-describedby="noticeText"
          required
        ></textarea>
        <button id="sendButton" type="submit" aria-label="Send message">Send</button>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
