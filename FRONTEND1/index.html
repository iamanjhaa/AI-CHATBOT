<!DOCTYPE html>
<html lang="mul">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIH26043 Problem Solving Chatbot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section class="chat-panel" aria-label="Problem solving chatbot">
      <header class="chat-header">
        <div>
          <p class="eyebrow">SIH26043 Phase 1 MVP</p>
          <h1 id="appTitle">Problem Solving Chatbot</h1>
        </div>
        <div class="header-controls">
          <label for="languageSelect" id="languageLabel">Language</label>
          <select id="languageSelect">
            <option value="hi">हिंदी</option>
            <option value="en" selected>English</option>
          </select>
          <span id="statusPill" class="status-pill">Mock AI</span>
        </div>
      </header>

      <div id="noticeText" class="notice">
        Describe a household or local societal problem in Hindi, Hinglish, or English.
      </div>

      <section id="chatMessages" class="chat-messages" aria-live="polite">
        <article class="message ai-message">
          <div class="avatar">AI</div>
          <div class="bubble">
            <p id="welcomeText">Hello! Tell me your problem. I will classify it as LOW, MEDIUM, or CRITICAL and suggest safe next steps.</p>
          </div>
        </article>
      </section>

      <div id="errorBox" class="error-box" role="alert"></div>

      <form id="chatForm" class="chat-form">
        <label id="problemLabel" class="sr-only" for="problemInput">Describe your problem</label>
        <textarea
          id="problemInput"
          dir="auto"
          rows="2"
          placeholder="Example: Mere bathroom ka tap leak ho raha hai..."
          required
        ></textarea>
        <button id="sendButton" type="submit">Send</button>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
